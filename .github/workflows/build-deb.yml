name: Build Enigma2 packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and embedded cores
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate version metadata
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            sed -n 's/^Version:[[:space:]]*//p' DEBIAN/control |
              head -n 1
          )"
          plugin_version="$(
            sed -n 's/^PLUGIN_VERSION = "\([^"]*\)"/\1/p' \
              usr/lib/enigma2/python/Plugins/Extensions/e2xray/__init__.py
          )"
          test -n "$version"
          test "$version" = "$plugin_version"

      - name: Validate embedded Xray cores
        shell: bash
        run: |
          set -euo pipefail

          sha256sum -c cores/SHA256SUMS

          arm_core="cores/arm64/xray"
          mips_core="cores/mipsel/xray"

          readelf -h "$arm_core" | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h "$arm_core" |
            grep -Eq "Data:.*2's complement, little endian"
          readelf -h "$arm_core" |
            grep -Eq 'Machine:[[:space:]]+AArch64'

          readelf -h "$mips_core" | grep -Eq 'Class:[[:space:]]+ELF32'
          readelf -h "$mips_core" |
            grep -Eq "Data:.*2's complement, little endian"
          readelf -h "$mips_core" | grep -Eq 'Machine:.*MIPS'

      - name: Validate Python and shell files
        shell: bash
        run: |
          set -euo pipefail

          plugin="usr/lib/enigma2/python/Plugins/Extensions/e2xray/plugin.py"
          parser="usr/lib/enigma2/python/Plugins/Extensions/e2xray/proxy_config.py"
          ctl="usr/lib/enigma2/python/Plugins/Extensions/e2xray/e2xrayctl.sh"

          python3 -m py_compile "$plugin" "$parser"
          bash -n build.sh DEBIAN/postinst DEBIAN/prerm DEBIAN/postrm \
            etc/init.d/e2xray "$ctl"
          python3 tests/test_proxy_config.py

      - name: Validate Internet status check
        shell: bash
        run: |
          set -euo pipefail

          ctl="usr/lib/enigma2/python/Plugins/Extensions/e2xray/e2xrayctl.sh"
          plugin="usr/lib/enigma2/python/Plugins/Extensions/e2xray/plugin.py"
          ! grep -qi 'arvancloud' "$ctl" README.md
          ! grep -q 'E2XRAY_NET=NATIONAL' "$ctl" "$plugin"
          grep -q 'https://dash.cloudflare.com' "$ctl"

  build:
    name: Build ${{ matrix.architecture }} DEB
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            core: cores/arm64/xray
            elf_class: ELF64
            elf_machine: AArch64
          - architecture: mipsel
            core: cores/mipsel/xray
            elf_class: ELF32
            elf_machine: MIPS

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail

          package="$(
            sed -n 's/^Package:[[:space:]]*//p' DEBIAN/control |
              head -n 1
          )"
          version="$(
            sed -n 's/^Version:[[:space:]]*//p' DEBIAN/control |
              head -n 1
          )"
          test -n "$package"
          test -n "$version"

          filename="${package}_${version}_${{ matrix.architecture }}.deb"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${package}_${version}_${{ matrix.architecture }}" \
            >> "$GITHUB_OUTPUT"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          chmod +x build.sh
          ./build.sh "${{ matrix.architecture }}" "$GITHUB_WORKSPACE/dist"

      - name: Inspect package
        shell: bash
        run: |
          set -euo pipefail

          package="dist/${{ steps.package.outputs.filename }}"
          test -s "$package"
          test "$(dpkg-deb -f "$package" Architecture)" = \
            "${{ matrix.architecture }}"

          members="$(ar t "$package")"
          printf '%s\n' "$members"
          printf '%s\n' "$members" | grep -qx 'control.tar.gz'
          printf '%s\n' "$members" | grep -qx 'data.tar.gz'
          if printf '%s\n' "$members" | grep -q '\.zst$'; then
            echo "The package uses zstd and is incompatible with DreamOS." >&2
            exit 1
          fi

          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          dpkg-deb -x "$package" "$extracted"
          packaged_core="$extracted/usr/lib/e2xray/bin/xray"
          cmp "${{ matrix.core }}" "$packaged_core"
          readelf -h "$packaged_core" |
            grep -Eq 'Class:[[:space:]]+${{ matrix.elf_class }}'
          readelf -h "$packaged_core" |
            grep -Eq "Data:.*2's complement, little endian"
          readelf -h "$packaged_core" |
            grep -Eq 'Machine:.*${{ matrix.elf_machine }}'

          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" >/dev/null
          if dpkg-deb --contents "$package" |
              grep -Eq '/(\.github|cores|tests)(/|$)|/(README\.md|build\.sh)$'; then
            echo "Development files leaked into the installable package." >&2
            exit 1
          fi

          sha256sum "$package" > "$package.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            dist/${{ steps.package.outputs.filename }}
            dist/${{ steps.package.outputs.filename }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build-openatv8:
    name: Build arm64 IPK for OpenATV 8
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail

          package="$(
            sed -n 's/^Package:[[:space:]]*//p' DEBIAN/control |
              head -n 1
          )"
          version="$(
            sed -n 's/^Version:[[:space:]]*//p' DEBIAN/control |
              head -n 1
          )"
          test -n "$package"
          test -n "$version"

          filename="${package}_${version}_arm64.ipk"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${package}_${version}_openatv8_arm64" \
            >> "$GITHUB_OUTPUT"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          chmod +x build.sh
          ./build.sh ipk arm64 "$GITHUB_WORKSPACE/dist"

      - name: Inspect package
        shell: bash
        run: |
          set -euo pipefail

          package="dist/${{ steps.package.outputs.filename }}"
          test -s "$package"

          members="$(ar t "$package")"
          printf '%s\n' "$members"
          printf '%s\n' "$members" | grep -qx 'debian-binary'
          printf '%s\n' "$members" | grep -qx 'control.tar.gz'
          printf '%s\n' "$members" | grep -qx 'data.tar.gz'

          extracted="$(mktemp -d)"
          control="$(mktemp -d)"
          trap 'rm -rf "$extracted" "$control"' EXIT

          ar p "$package" control.tar.gz | tar -xz -C "$control"
          grep -qx 'Architecture: arm64' "$control/control"

          ar p "$package" data.tar.gz | tar -xz -C "$extracted"
          packaged_core="$extracted/usr/lib/e2xray/bin/xray"
          cmp cores/arm64/xray "$packaged_core"
          readelf -h "$packaged_core" |
            grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h "$packaged_core" |
            grep -Eq "Data:.*2's complement, little endian"
          readelf -h "$packaged_core" |
            grep -Eq 'Machine:.*AArch64'

          if find "$extracted" -path '*/.github/*' -o -path '*/cores/*' \
              -o -path '*/tests/*' -o -name README.md -o -name build.sh |
              grep -q .; then
            echo "Development files leaked into the installable package." >&2
            exit 1
          fi

          sha256sum "$package" > "$package.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            dist/${{ steps.package.outputs.filename }}
            dist/${{ steps.package.outputs.filename }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
