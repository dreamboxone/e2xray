name: Build Debian package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 DEB
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail

          package="$(sed -n 's/^Package:[[:space:]]*//p' DEBIAN/control | head -n 1)"
          version="$(sed -n 's/^Version:[[:space:]]*//p' DEBIAN/control | head -n 1)"
          architecture="$(sed -n 's/^Architecture:[[:space:]]*//p' DEBIAN/control | head -n 1)"

          test -n "$package"
          test -n "$version"
          test "$architecture" = "arm64"

          filename="${package}_${version}_${architecture}.deb"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${package}_${version}_${architecture}" >> "$GITHUB_OUTPUT"

      - name: Validate embedded Xray
        shell: bash
        run: |
          set -euo pipefail

          xray="usr/lib/e2xray/bin/xray"
          test -s "$xray"
          readelf -h "$xray" | grep -Eq 'Machine:[[:space:]]+AArch64'

      - name: Validate share-link parser
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import importlib.util
          import json
          from pathlib import Path

          parser_path = Path(
              "usr/lib/enigma2/python/Plugins/Extensions/e2xray/proxy_config.py"
          )
          spec = importlib.util.spec_from_file_location("proxy_config", parser_path)
          parser = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(parser)

          vmess = {
              "v": "2",
              "add": "198.51.100.2",
              "port": "443",
              "id": "22222222-2222-4222-8222-222222222222",
              "scy": "auto",
              "net": "xhttp",
              "path": "/xhttp",
              "host": "vmess.example.com",
              "tls": "tls",
              "sni": "vmess.example.com",
              "fp": "chrome",
          }
          vmess_link = "vmess://" + base64.urlsafe_b64encode(
              json.dumps(vmess).encode()
          ).decode().rstrip("=")

          cases = [
              (
                  "vless://11111111-1111-4111-8111-111111111111@192.0.2.1:2096"
                  "?encryption=none&security=tls&sni=example.com&fp=chrome"
                  "&type=ws&host=example.com&path=%2F",
                  "vless",
                  "websocket",
              ),
              (vmess_link, "vmess", "xhttp"),
              (
                  "trojan://secret@203.0.113.3:443?security=reality"
                  "&sni=example.org&fp=chrome&pbk=public-key&sid=abcd&type=grpc"
                  "&serviceName=route",
                  "trojan",
                  "grpc",
              ),
              (
                  "ss://YWVzLTI1Ni1nY206cGFzc3dvcmQ@203.0.113.4:8388",
                  "shadowsocks",
                  "raw",
              ),
          ]

          for link, protocol, method in cases:
              parsed = parser.parse_share_link(link)
              assert parsed["PROTOCOL"] == protocol
              assert parsed["outbound"]["protocol"] == protocol
              assert parsed["outbound"]["streamSettings"]["method"] == method
              config = parser.build_xray_config(parsed)
              assert config["inbounds"][0]["protocol"] == "tun"
              assert config["outbounds"][0]["tag"] == "proxy"
          PY

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          chmod +x build.sh
          ./build.sh "$GITHUB_WORKSPACE/dist"

          cd dist
          test -s "${{ steps.package.outputs.filename }}"

          members="$(ar t "${{ steps.package.outputs.filename }}")"
          printf '%s\n' "$members"
          printf '%s\n' "$members" | grep -qx 'control.tar.gz'
          printf '%s\n' "$members" | grep -qx 'data.tar.gz'
          if printf '%s\n' "$members" | grep -q '\.zst$'; then
            echo "The package uses zstd and is not compatible with OpenDreambox." >&2
            exit 1
          fi

          sha256sum "${{ steps.package.outputs.filename }}" \
            > "${{ steps.package.outputs.filename }}.sha256"
          dpkg-deb --info "${{ steps.package.outputs.filename }}"
          dpkg-deb --contents "${{ steps.package.outputs.filename }}" >/dev/null
          if dpkg-deb --contents "${{ steps.package.outputs.filename }}" |
              grep -Eq '/(\.github|README\.md|build\.sh)$'; then
            echo "Development files leaked into the installable package." >&2
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            dist/${{ steps.package.outputs.filename }}
            dist/${{ steps.package.outputs.filename }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
